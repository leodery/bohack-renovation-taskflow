<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>四方协作过程</title>
<link rel="stylesheet" href="/static/collaboration-scene.css"></head><body>
<h1>把每一方的依据，放在一起。</h1><p>每一步都有具体的人，每一次确认都有记录。</p>
<div class="steps"><section class="step"><span>01 / 住户</span><h2>说出需求</h2><p>保留原话，明确想要改变的地方。</p></section><section class="step"><span>02 / 设计与施工</span><h2>补全依据</h2><p>核对图纸、材料、报价与到货日期。</p></section><section class="step"><span>03 / 三方确认</span><h2>共同确认</h2><p>设计与施工确认可行，住户确认同一版方案。</p></section><section class="step"><span>04 / 施工团队</span><h2>执行交付</h2><p>施工方上传照片，项目管理依据 AI 初审终审，住户可查看记录。</p></section></div>
<div class="outcome"><p>按确认方案施工，发生修订时，各方重新确认。</p></div>
<button type="button" id="play" hidden>播放协作构建</button><button type="button" id="stop" hidden>跳过动画</button>
<p id="scene-status" role="status"></p>
<script type="module" src="/static/collaboration-scene.js"></script></body></html>
